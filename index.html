      <h1>Mathieu Poupon</h1>
      <p>Ocean science and environmental policy researcher. CNRS postdoctoral fellow at LOCEAN–IPSL
      (Sorbonne Université), after a PhD at Princeton University. I work on the natural carbon cycle in
      the ocean and its deliberate modification by humans — zooplankton and the biological carbon pump,
      and marine carbon dioxide removal (mCDR) — and on what each commits us to in decision-making.</p>
      <p>Contact: <a href="mailto:mathieu.poupon@locean.ipsl.fr">mathieu.poupon@locean.ipsl.fr</a> ·
      <a href="https://orcid.org/0000-0002-8136-4011">ORCID</a> ·
      <a href="https://scholar.google.com/citations?user=1kRXs-IAAAAJ">Google Scholar</a> ·
      <a href="https://github.com/mpoupon">GitHub</a> ·
      <a href="https://www.linkedin.com/in/mathieu-poupon">LinkedIn</a></p>
      <h2>Selected publications</h2>
      <ul>
        <li><a href="https://doi.org/10.1038/s41467-026-72144-x">How much do zooplankton and fine-scale processes matter for the ocean biological pump?</a> — Nature Communications (2026)</li>
        <li><a href="https://doi.org/10.1029/2025GB008912">Global Eddy Subduction Carbon Pump from Argo Floats</a> — Global Biogeochemical Cycles (2026)</li>
        <li><a href="https://doi.org/10.5194/bg-22-4743-2025">Phytoplankton community succession and biogeochemistry in a bloom simulation experiment at an estuary–ocean interface</a> — Biogeosciences (2025)</li>
        <li><a href="https://doi.org/10.5194/os-21-851-2025">Chlorophyll shading reduces zooplankton diel migration depth in a high-resolution physical–biogeochemical model</a> — Ocean Science (2025)</li>
        <li><a href="https://doi.org/10.1029/2022GL102123">Pacific decadal oscillation influences tropical oxygen minimum zone extent and obscures anthropogenic changes</a> — Geophysical Research Letters (2023)</li>
        <li><a href="https://doi.org/10.1029/2021GB007192">Coastlines at Risk of Hypoxia from Natural Variability in the Northern Indian Ocean</a> — Global Biogeochemical Cycles (2022)</li>
      </ul>
