<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Mathieu Poupon</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #FAF8F3; color: #16273A; font-family: Georgia, 'Times New Roman', serif; }
    main { text-align: center; padding: 24px; }
    h1 { font-weight: 400; font-size: 42px; margin: 0 0 8px; }
    p  { color: #5C6672; font-style: italic; }
    a  { color: #16273A; }
  </style>
  <script>
    // Redirect to the homepage after a short pause, keeping any hash route.
    setTimeout(function () { window.location.replace('/' + (window.location.hash || '')); }, 2500);
  </script>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>Redirecting to <a href="/">mpoupon.github.io</a>…</p>
  </main>
</body>
</html>
